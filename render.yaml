services:
  - type: web
    name: qouterx-api
    runtime: docker
    plan: starter
    rootDir: .
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CLIENT_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: QOUTERX_DATA_DIR
        value: /var/qouterx/data
      - key: ENABLE_FILE_ACTIVITY_WATCHER
        value: "0"
      - key: APP_OWNER_EMAIL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
    disk:
      name: qouterx-data
      mountPath: /var/qouterx/data
      sizeGB: 5

  - type: web
    name: qouterx-web
    runtime: static
    rootDir: .
    buildCommand: npm ci --workspace=apps/web --include-workspace-root=false && npm run build:web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_APP_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
